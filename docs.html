    <style>
        :root {
            --docs-bg: #191724;
            --docs-surface: #211f2d;
            --docs-accent: #f6c177;
            --docs-rose: #eb6f92;
            --docs-foam: #9ccfd8;
            --docs-iris: #c4a7e7;
            --docs-text: #e0def4;
            --docs-muted: #908caa;
            --docs-border: rgba(255, 255, 255, 0.08);
        }

        body.docs-view-page {
            background-color: var(--docs-bg);
            color: var(--docs-text);
            font-family: 'Urbanist', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            cursor: auto;
        }

        .docs-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 100px 24px 60px 24px;
        }

        .docs-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--docs-border);
            padding-bottom: 25px;
        }

        .docs-nav-back {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--docs-muted);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .docs-nav-back:hover {
            color: var(--docs-accent);
        }

        .game-title-wrap h1 {
            font-size: 2.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin: 0 0 10px 0;
            color: var(--docs-text);
            text-shadow: 0 0 20px rgba(246, 193, 119, 0.25);
        }

        .game-meta-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .game-meta-tags span {
            font-size: 0.8rem;
            padding: 4px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--docs-border);
            border-radius: 20px;
            color: var(--docs-foam);
        }

        /* Glass Tab Controller */
        .docs-tabs-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--docs-border);
            padding-bottom: 15px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--docs-muted);
            font-family: 'Urbanist', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--docs-text);
            background: rgba(255, 255, 255, 0.03);
        }

        .tab-btn.active {
            color: var(--docs-accent);
            background: rgba(246, 193, 119, 0.08);
            border: 1px solid rgba(246, 193, 119, 0.2);
            text-shadow: 0 0 8px rgba(246, 193, 119, 0.3);
        }

        /* Content Panel Layout */
        .tab-panel {
            display: none;
            background: var(--docs-surface);
            border: 1px solid var(--docs-border);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            animation: fadeIn 0.4s ease-out forwards;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-panel h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--docs-iris);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
        }

        .tab-panel p {
            line-height: 1.7;
            color: var(--docs-text);
            font-size: 1.05rem;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .tab-panel ul {
            padding-left: 20px;
            margin-bottom: 20px;
        }

        .tab-panel li {
            line-height: 1.8;
            margin-bottom: 8px;
            font-size: 1.02rem;
            color: var(--docs-text);
            opacity: 0.95;
        }

        /* Architectural / Code display */
        .code-block-header {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--docs-border);
            border-bottom: none;
            padding: 8px 16px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: var(--docs-muted);
        }

        pre {
            margin: 0 0 25px 0;
            background: #111019;
            border: 1px solid var(--docs-border);
            padding: 20px;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            overflow-x: auto;
        }

        code {
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #e0def4;
        }

        .token-keyword { color: #eb6f92; }
        .token-function { color: #c4a7e7; }
        .token-string { color: #f6c177; }
        .token-comment { color: #6e6a86; font-style: italic; }
        .token-number { color: #31748f; }

        /* Controls styling */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .control-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--docs-border);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-key {
            font-family: 'Fira Code', monospace;
            font-weight: 700;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 4px;
            color: var(--docs-accent);
            font-size: 0.85rem;
            box-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }

        .control-action {
            font-weight: 600;
            color: var(--docs-text);
        }

        /* Error state formatting */
        .error-container {
            text-align: center;
            padding: 60px 20px;
        }

        .error-container h1 {
            color: var(--docs-rose);
            font-size: 2rem;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .docs-container { padding-top: 60px; }
            .game-title-wrap h1 { font-size: 2.2rem; }
            .tab-panel { padding: 25px; }
        }
    </style>
</head>

                    <h2>Core Gameplay Systems Documentation</h2>
                    <p>This document provides a detailed technical breakdown of the input mapping abstraction, player locomotion, environment sensing, parkour, climbing, and camera utilities. It describes how these components are designed, how they function under the hood, and how data flows between them.</p>
                    
                    <h3>1. Input Mapping & Abstraction</h3>
                    <p>The project utilizes Unity's <strong>New Input System</strong> to map physical hardware inputs (Keyboard, Mouse) to logical gameplay actions. These are defined inside the <code>PlayerBasicLocomotion</code> action map:</p>
                    <ul>
                        <li><strong>Movement (<code>Vector2</code>):</strong> Mapped to standard <code>WASD</code> keys. Exposes continuous horizontal and vertical movement vectors.</li>
                        <li><strong>Look (<code>Vector2</code>):</strong> Mapped to <code>&lt;Mouse&gt;/delta</code>. Exposes mouse pointer movement speed for looking around.</li>
                        <li><strong>Run (<code>Button</code>):</strong> Mapped to <code>&lt;Keyboard&gt;/leftShift</code> to trigger or hold sprint speeds.</li>
                        <li><strong>Crouch (<code>Button</code>):</strong> Mapped to <code>&lt;Keyboard&gt;/c</code> to toggle crouching state.</li>
                        <li><strong>JumpFromLedge (<code>Button</code>):</strong> Mapped to <code>&lt;Keyboard&gt;/space</code> to initiate jumping while running near edges.</li>
                        <li><strong>JumpToClimb (<code>Button</code>):</strong> Mapped to <code>&lt;Keyboard&gt;/space</code> to initiate jumps toward adjacent climb points.</li>
                        <li><strong>GetDownFromLedge_Key (<code>Button</code>):</strong> Mapped to <code>&lt;Keyboard&gt;/leftCtrl</code> to drop off high ledges.</li>
                    </ul>

                    <h4>Input Manager Abstraction Wrapper (<code>PlayerInputManager.cs</code>)</h4>
                    <p>This abstraction layer acts as a wrapper around the auto-generated <code>PlayerInput</code> C# class. It is polled every frame in <code>Update()</code> to populate simple, public fields (such as <code>MovementInput</code>, <code>Sprint</code>, <code>Crouch</code>, <code>jumpToClimb</code>, etc.). This decoupling allows other scripts (like <code>PlayerMovement</code> and <code>ClimbController</code>) to easily read input states without querying the event-based input system APIs directly.</p>
                    <img src="assets/images/diagrams/parkour_locomotion_2d.png" alt="Locomotion Loop Diagram" style="width:100%; max-width:700px; border-radius:8px; border:1px solid var(--docs-border); margin: 15px 0; display:block;">

                    <h3>2. Camera Rig & Mouse Look System (<code>CameraFollow.cs</code> & <code>MouseLook.cs</code>)</h3>
                    <p>The camera rig tracks the player using frame-rate independent position smoothing and clamps horizontal/vertical viewing angles to prevent camera clipping:</p>
                    
                    <!-- SVG Camera Rig Diagram -->
                    <div style="margin: 20px 0; text-align: center;">
                        <svg viewBox="0 0 600 260" style="width: 100%; max-width: 600px; border-radius: 8px; border: 1px solid var(--docs-border); background: #111019; display: block;">
                            <rect width="600" height="260" fill="#111019"/>
                            <text x="30" y="35" fill="var(--docs-text)" font-size="12" font-family="'Urbanist', sans-serif" font-weight="bold">CAMERA RIG PROFILE SCHEMATIC</text>
                            
                            <!-- Player Anchor Pivot -->
                            <circle cx="200" cy="150" r="8" fill="#f6c177"/>
                            <line x1="200" y1="150" x2="200" y2="70" stroke="#f6c177" stroke-width="1.5" stroke-dasharray="3 3"/>
                            <text x="200" y="180" text-anchor="middle" fill="#f6c177" font-size="10" font-family="'Urbanist', sans-serif">Player Pivot (Target)</text>

                            <!-- Rig Follow Offset Vector -->
                            <line x1="200" y1="150" x2="380" y2="100" stroke="#9ccfd8" stroke-width="2"/>
                            <polygon points="380,100 370,105 375,97" fill="#9ccfd8"/>
                            <text x="290" y="115" text-anchor="middle" fill="#9ccfd8" font-size="10" font-family="'Urbanist', sans-serif" transform="rotate(-15,290,115)">Follow Vector (Lerped)</text>

                            <!-- Pitch angle limits -->
                            <path d="M 380 100 A 180 180 0 0 1 340 40" fill="none" stroke="#eb6f92" stroke-width="1.5" stroke-dasharray="4 4"/>
                            <path d="M 380 100 A 180 180 0 0 0 410 160" fill="none" stroke="#eb6f92" stroke-width="1.5" stroke-dasharray="4 4"/>
                            <text x="430" y="45" fill="#eb6f92" font-size="10" font-family="'Urbanist', sans-serif">Max Pitch Clamp (+60°)</text>
                            <text x="430" y="165" fill="#eb6f92" font-size="10" font-family="'Urbanist', sans-serif">Min Pitch Clamp (-45°)</text>

                            <!-- Camera Node -->
                            <rect x="380" y="85" width="40" height="30" rx="3" fill="#1e1b26" stroke="#9ccfd8" stroke-width="1.5"/>
                            <circle cx="400" cy="100" r="5" fill="#9ccfd8"/>
                            <text x="400" y="130" text-anchor="middle" fill="var(--docs-muted)" font-size="9" font-family="'Urbanist', sans-serif">Camera Node</text>
                        </svg>
                    </div>
                `,
                mechanics: `
                    <h3>3. Environment Sensing (<code>EnvoirnmentScanner.cs</code>)</h3>
                    <p>The player scans their surroundings in real time using a series of layered, multi-point raycasts to determine wall structures, heights, and drop-off slopes:</p>

                    <!-- SVG Ledge Raycast Sensing Diagram -->
                    <div style="margin: 20px 0; text-align: center;">
                        <svg viewBox="0 0 600 260" style="width: 100%; max-width: 600px; border-radius: 8px; border: 1px solid var(--docs-border); background: #111019; display: block;">
                            <rect width="600" height="240" fill="#111019"/>
                            <text x="30" y="35" fill="var(--docs-text)" font-size="12" font-family="'Urbanist', sans-serif" font-weight="bold">ENVIRONMENT RAYCAST SENSING SCHEMATIC</text>

                            <!-- Player Silhouette representing chest-height raycast origin -->
                            <circle cx="150" cy="120" r="10" fill="#1e1b26" stroke="var(--docs-border)" stroke-width="2"/>
                            <line x1="150" y1="130" x2="150" y2="200" stroke="var(--docs-border)" stroke-width="2"/>
                            <line x1="150" y1="150" x2="110" y2="170" stroke="var(--docs-border)" stroke-width="2"/>
                            <line x1="150" y1="150" x2="190" y2="170" stroke="var(--docs-border)" stroke-width="2"/>
                            
                            <!-- Forward Raycast Check -->
                            <line x1="150" y1="120" x2="350" y2="120" stroke="#eb6f92" stroke-width="2"/>
                            <polygon points="350,120 340,116 340,124" fill="#eb6f92"/>
                            <text x="250" y="110" text-anchor="middle" fill="#eb6f92" font-size="10" font-family="'Urbanist', sans-serif">1. Forward Raycast (Chest Height)</text>

                            <!-- Obstacle / Ledge Block -->
                            <rect x="350" y="140" width="180" height="80" fill="#1e1b26" stroke="#9ccfd8" stroke-width="1.5"/>
                            <text x="440" y="185" text-anchor="middle" fill="#9ccfd8" font-size="11" font-family="'Urbanist', sans-serif">Obstacle Block</text>

                            <!-- Height Downward Check -->
                            <line x1="390" y1="80" x2="390" y2="140" stroke="#f6c177" stroke-width="2"/>
                            <polygon points="390,140 386,130 394,130" fill="#f6c177"/>
                            <text x="390" y="65" text-anchor="middle" fill="#f6c177" font-size="10" font-family="'Urbanist', sans-serif">2. Height Raycast (Downward)</text>
                            
                            <!-- Ground Surface -->
                            <line x1="50" y1="220" x2="550" y2="220" stroke="var(--docs-border)" stroke-width="2"/>
                        </svg>
                    </div>

                    <h3>4. Parkour System (<code>ParkourController.cs</code>)</h3>
                    <p>The parkour system automatically detects obstacles in the player's path during sprints and executes custom movement animations (such as vaults, wall jumps, or hop overs).</p>

                    <!-- Custom SVG Flowchart representing the Parkour Checking Logic -->
                    <div style="margin: 20px 0; text-align: center;">
                        <svg viewBox="0 0 600 320" style="width: 100%; max-width: 600px; border-radius: 8px; border: 1px solid var(--docs-border); background: #111019; display: block;">
                            <rect width="600" height="320" fill="#111019"/>
                            
                            <!-- Flow Boxes -->
                            <rect x="50" y="30" width="160" height="40" rx="4" fill="#1e1b26" stroke="#9ccfd8" stroke-width="1"/>
                            <text x="130" y="55" text-anchor="middle" fill="#9ccfd8" font-size="10" font-family="'Urbanist', sans-serif">Player Sprints Towards Wall</text>
                            
                            <path d="M 130 70 L 130 105" stroke="#f6c177" stroke-width="1.5"/>
                            <polygon points="130,110 126,100 134,100" fill="#f6c177"/>
                            
                            <rect x="50" y="110" width="160" height="40" rx="4" fill="#1e1b26" stroke="#f6c177" stroke-width="1.5"/>
                            <text x="130" y="133" text-anchor="middle" fill="#f6c177" font-size="10" font-family="'Urbanist', sans-serif">Obstacle Detected?</text>
                            
                            <!-- No branch -->
                            <path d="M 210 130 L 330 130" stroke="#eb6f92" stroke-width="1.5"/>
                            <polygon points="335,130 325,126 325,134" fill="#eb6f92"/>
                            <text x="270" y="120" text-anchor="middle" fill="#eb6f92" font-size="9" font-family="'Urbanist', sans-serif">No</text>
                            
                            <rect x="340" y="110" width="180" height="40" rx="4" fill="#1e1b26" stroke="#eb6f92" stroke-width="1"/>
                            <text x="430" y="133" text-anchor="middle" fill="#eb6f92" font-size="10" font-family="'Urbanist', sans-serif">Continue Standard Locomotion</text>
                            
                            <!-- Yes branch -->
                            <path d="M 130 150 L 130 185" stroke="#9ccfd8" stroke-width="1.5"/>
                            <polygon points="130,190 126,180 134,180" fill="#9ccfd8"/>
                            <text x="140" y="170" text-anchor="middle" fill="#9ccfd8" font-size="9" font-family="'Urbanist', sans-serif">Yes</text>
                            
                            <rect x="40" y="190" width="180" height="40" rx="4" fill="#1e1b26" stroke="#9ccfd8" stroke-width="1"/>
                            <text x="130" y="213" text-anchor="middle" fill="#9ccfd8" font-size="10" font-family="'Urbanist', sans-serif">Verify Parkour Action Heights</text>
                            
                            <path d="M 130 230 L 130 265" stroke="#f6c177" stroke-width="1.5"/>
                            <polygon points="130,270 126,260 134,260" fill="#f6c177"/>
                            
                            <rect x="30" y="270" width="200" height="40" rx="4" fill="#1e1b26" stroke="#f6c177" stroke-width="1.5"/>
                            <text x="130" y="293" text-anchor="middle" fill="#f6c177" font-size="10" font-family="'Urbanist', sans-serif" font-weight="bold">Trigger Target-Matching Action</text>
                        </svg>
                    </div>

                    <h3>5. Climbing System (<code>ClimbController.cs</code> & <code>ClimbPoint.cs</code>)</h3>
                    <p>A complete modular climbing system designed to allow the player to grab ledges, shimmy horizontally, jump between grab points, and pull themselves up. Limiting slide vectors prevents the character skeleton from sliding off model meshes:</p>

                    <!-- SVG Ledge Bounds Constraints Diagram -->
                    <div style="margin: 20px 0; text-align: center;">
                        <svg viewBox="0 0 600 200" style="width: 100%; max-width: 600px; border-radius: 8px; border: 1px solid var(--docs-border); background: #111019; display: block;">
                            <rect width="600" height="200" fill="#111019"/>
                            <text x="30" y="35" fill="var(--docs-text)" font-size="12" font-family="'Urbanist', sans-serif" font-weight="bold">LEDGE SHIMMY BOUNDS LIMITATION SCHEMATIC</text>

                            <!-- Horizontal Ledge Rail -->
                            <line x1="100" y1="100" x2="500" y2="100" stroke="#9ccfd8" stroke-width="4"/>
                            
                            <!-- Left Limit Boundary -->
                            <circle cx="100" cy="100" r="8" fill="#eb6f92"/>

                            <!-- Right Limit Boundary -->
                            <circle cx="500" cy="100" r="8" fill="#eb6f92"/>

                            <text x="300" y="103" text-anchor="middle" fill="#f6c177" font-size="10" font-family="'Urbanist', sans-serif" font-weight="bold">Shimmy Actor</text>
                            
                            <path d="M 240 100 L 210 100" stroke="#f6c177" stroke-width="1.5"/>

                            <path d="M 360 100 L 390 100" stroke="#f6c177" stroke-width="1.5"/>
                            <polygon points="395,100 385,96 385,104" fill="#f6c177"/>
                            
                            <text x="300" y="150" text-anchor="middle" fill="var(--docs-muted)" font-size="9" font-family="'Urbanist', sans-serif">Hanging position clamped inside leftLimit and rightLimit bounds</text>

                    </div>

                    <h3>6. Ledge Collision & Boundary Halting</h3>
                    <p>To prevent the player from accidentally sliding off high surfaces during fast locomotion, the locomotion loop uses a ledge halting boundary system. When the player runs near a cliff or platform edge, the scanner projects downward raycast steps. If a drop-off is detected and no active jump or drop input is registered, movement velocity is instantly clamped to zero.</p>
                    
                    <!-- SVG Ledge Collision Detection Diagram -->
                    <div style="margin: 20px 0; text-align: center;">
                        <svg viewBox="0 0 600 220" style="width: 100%; max-width: 600px; border-radius: 8px; border: 1px solid var(--docs-border); background: #111019; display: block;">
                            <rect width="600" height="220" fill="#111019"/>
                            <text x="30" y="35" fill="var(--docs-text)" font-size="12" font-family="'Urbanist', sans-serif" font-weight="bold">LEDGE COLLISION & VELOCITY CLAMP SCHEMATIC</text>

        function switchTab(tabId) {
            // Deactivate all tabs
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));

            // Find clicked button based on tabId
            const clickedBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => btn.textContent.toLowerCase().includes(tabId.substring(0, 4)));
            if (clickedBtn) clickedBtn.classList.add('active');

            // Activate target panel
            const panel = document.getElementById(`panel-${tabId}`);
            if (panel) panel.classList.add('active');
        }

        // Handle dynamic page transition animations and Back to Home click interceptor
        const pageOverlay = document.getElementById('pageOverlay');
        if (pageOverlay) {
            requestAnimationFrame(() => requestAnimationFrame(() => pageOverlay.classList.add('loaded')));

            // Smooth fade out when navigating back to home
            document.querySelectorAll('.docs-nav-back, .error-container a').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (e.metaKey || e.ctrlKey) return;
                    e.preventDefault();
                    pageOverlay.classList.remove('loaded');
                    setTimeout(() => {
                        window.location.href = btn.getAttribute('href');
                    }, 520);
                });
            });
        }

        // Handle Back-Forward Cache (bfcache) restoration to prevent frozen transition screen
