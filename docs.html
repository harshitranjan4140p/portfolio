    <style>
        :root {
            --docs-bg: #191724;
            --docs-surface: #211f2d;
            --docs-accent: #f6c177;
            --docs-rose: #eb6f92;
            --docs-foam: #9ccfd8;
            --docs-iris: #c4a7e7;
            --docs-text: #e0def4;
            --docs-muted: #908caa;
            --docs-border: rgba(255, 255, 255, 0.08);
        }

        body.docs-view-page {
            background-color: var(--docs-bg);
            color: var(--docs-text);
            font-family: 'Urbanist', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            cursor: auto;
        }

        .docs-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 100px 24px 60px 24px;
        }

        .docs-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--docs-border);
            padding-bottom: 25px;
        }

        .docs-nav-back {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--docs-muted);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .docs-nav-back:hover {
            color: var(--docs-accent);
        }

        .game-title-wrap h1 {
            font-size: 2.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin: 0 0 10px 0;
            color: var(--docs-text);
            text-shadow: 0 0 20px rgba(246, 193, 119, 0.25);
        }

        .game-meta-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .game-meta-tags span {
            font-size: 0.8rem;
            padding: 4px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--docs-border);
            border-radius: 20px;
            color: var(--docs-foam);
        }

        /* Glass Tab Controller */
        .docs-tabs-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--docs-border);
            padding-bottom: 15px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--docs-muted);
            font-family: 'Urbanist', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--docs-text);
            background: rgba(255, 255, 255, 0.03);
        }

        .tab-btn.active {
            color: var(--docs-accent);
            background: rgba(246, 193, 119, 0.08);
            border: 1px solid rgba(246, 193, 119, 0.2);
            text-shadow: 0 0 8px rgba(246, 193, 119, 0.3);
        }

        /* Content Panel Layout */
        .tab-panel {
            display: none;
            background: var(--docs-surface);
            border: 1px solid var(--docs-border);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            animation: fadeIn 0.4s ease-out forwards;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-panel h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--docs-iris);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
        }

        .tab-panel p {
            line-height: 1.7;
            color: var(--docs-text);
            font-size: 1.05rem;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .tab-panel ul {
            padding-left: 20px;
            margin-bottom: 20px;
        }

        .tab-panel li {
            line-height: 1.8;
            margin-bottom: 8px;
            font-size: 1.02rem;
            color: var(--docs-text);
            opacity: 0.95;
        }

        /* Architectural / Code display */
        .code-block-header {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--docs-border);
            border-bottom: none;
            padding: 8px 16px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: var(--docs-muted);
        }

        pre {
            margin: 0 0 25px 0;
            background: #111019;
            border: 1px solid var(--docs-border);
            padding: 20px;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            overflow-x: auto;
        }

        code {
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #e0def4;
        }

        .token-keyword { color: #eb6f92; }
        .token-function { color: #c4a7e7; }
        .token-string { color: #f6c177; }
        .token-comment { color: #6e6a86; font-style: italic; }
        .token-number { color: #31748f; }

        /* Controls styling */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .control-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--docs-border);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-key {
            font-family: 'Fira Code', monospace;
            font-weight: 700;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 4px;
            color: var(--docs-accent);
            font-size: 0.85rem;
            box-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }

        .control-action {
            font-weight: 600;
            color: var(--docs-text);
        }

        /* Error state formatting */
        .error-container {
            text-align: center;
            padding: 60px 20px;
        }

        .error-container h1 {
            color: var(--docs-rose);
            font-size: 2rem;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .docs-container { padding-top: 60px; }
            .game-title-wrap h1 { font-size: 2.2rem; }
            .tab-panel { padding: 25px; }
        }
    </style>
</head>

                    <p><strong>Parkour System</strong> is a state-of-the-art, custom physics-driven locomotion system built to redefine how players navigate 3D spatial environments. The design focuses on physical weight, momentum conservation, and seamless transitions between active states.</p>
                    <h3>1. Locomotion & Character Controller (<code>PlayerMovement.cs</code>)</h3>
                    <p>The foundation of the player's movement is built on top of a standard Unity <code>CharacterController</code> integrated with custom state-machine driven gravity, speed scaling, and animation control.</p>
                    <img src="assets/images/diagrams/parkour_locomotion_2d.png" alt="Locomotion Loop Diagram" style="width:100%; max-width:700px; border-radius:8px; border:1px solid var(--docs-border); margin: 15px 0; display:block;">
                    <h4>Key Engineering Features</h4>
                    <ul>
                        <li><strong>Camera-Relative Movement:</strong> Input vectors from the input manager are rotated relative to the player camera's forward/right vectors (ignoring the Y-axis) to ensure that pressing forward always moves the player in the direction the camera is facing.</li>
                        <li><strong>Grounded Override Mechanics:</strong> Standard Unity ground-checking is prone to remaining stuck when characters pull themselves up onto ledges or leap off walls. To resolve this, a grounded override state was implemented where setting character control to <code>false</code> (during animations/actions) forces <code>isGrounded</code> and the animator's state to <code>false</code>, allowing smooth transitions into airborne/falling animations without mid-air jerking.</li>
                        <li><strong>Air Control Acceleration:</strong> Smooth vertical and horizontal speed limits are calculated while in mid-air using interpolation thresholds, allowing minor trajectory modifications without breaking realistic physics.</li>
                    </ul>
                `,
                mechanics: `
                    <h3>2. Environmental Sensing (<code>EnvironmentScanner.cs</code>)</h3>
                    <p>To perform fluid parkour and climbing, the player needs to constantly "feel" the environment. The <code>EnvironmentScanner</code> handles this using predictive spatial raycasting.</p>
                    <img src="assets/images/diagrams/parkour_raycast_2d.png" alt="Environment Raycast Sensing Diagram" style="width:100%; max-width:700px; border-radius:8px; border:1px solid var(--docs-border); margin: 15px 0; display:block;">
                    <h4>Raycasting Methodologies</h4>
                    <ul>
                        <li><strong>Forward Obstacle Scan:</strong> Fired from a customized vertical offset (chest/waist height) in the direction of the player's movement to detect walls, fences, or blocks.</li>
                        <li><strong>Height Scan:</strong> Once a forward obstacle is hit, a vertical raycast is fired downward from a point <em>above</em> the obstacle to measure its exact height. This determines whether the player can vault it, step up, climb it, or jump over it.</li>
                        <li><strong>Three-Raycast Sampling:</strong> For ledge drop-offs, the script uses a utility (<code>ThreeRaycasts</code>) that samples three parallel downward raycasts across a horizontal span. This accurately calculates the exact drop-off height and wall angle, preventing the player from leaping off slopes that are too steep or flat.</li>
                    </ul>

                    <h3 style="margin-top: 30px;">3. Parkour Engine & Motion Warping (<code>ParkourController.cs</code> & <code>ParkourAction.cs</code>)</h3>
                    <p>The parkour system translates environmental detection into synchronized athletic actions using modular <code>ScriptableObject</code> configurations.</p>
                    <h4>Architectural Breakdown</h4>
                    <ol>
                        <li><strong>Action Lookup:</strong> The controller holds a list of pre-configured <code>ParkourAction</code> assets (e.g., Vault, StepUp, ClimbUp, VaultLow).</li>
                        <li><strong>Possibility Verification:</strong> When the player presses the run/jump trigger, <code>EnvironmentScanner</code> gathers the obstacle tag and height. The controller iterates through its actions, checking if the obstacle fits the height thresholds:<br><code style="background:transparent; border:none; padding:0; color:var(--docs-accent)">Min Height &le; Obstacle Height &le; Max Height</code></li>
                        <li><strong>Motion Warping (Target Matching):</strong> When an action is selected, the system triggers <code>Animator.MatchTarget()</code>. This warps the player's position and hands/feet smoothly to the exact obstacle hit point during a specified window of the animation clip:
                            <ul>
                                <li><strong>Left/Right Hands:</strong> Aligned precisely to the top shelf of a vault obstacle.</li>
                                <li><strong>Feet:</strong> Aligned to step on top of obstacles during a climb-up action.</li>
                            </ul>
                        </li>
                        <li><strong>Airborne Recovery Safety Loop:</strong> When jumping down or vaulting, a two-phase landing coroutine first checks that the player has left the ground (airborne phase) and then listens for the next grounded event to trigger the landing roll or run transition.</li>
                    </ol>
                `,
                technical: `
                    <h3>4. Climbing System & Ledge Scanning (<code>ClimbController.cs</code> & <code>ClimbPoint.cs</code>)</h3>
                    <p>The climbing engine handles free-climbing, hanging, shimmies, ledge leaps, and drop-downs. It is entirely driven by network nodes representing ledges (<code>ClimbPoint</code>).</p>
                    <img src="assets/images/diagrams/climbpoint_2d.png" alt="ClimbPoint Neighbour Node System" style="width:100%; max-width:700px; border-radius:8px; border:1px solid var(--docs-border); margin: 15px 0; display:block;">
                    <h4>The 3-Phase Neighbour Auto-Scanner (Core Engineering Achievement)</h4>
                    <p>To make level creation fast and clean, we engineered a state-of-the-art <strong>Phased Neighbour Scanner</strong> inside <code>ClimbPoint.cs</code> that auto-scans nearby ledges and links them mathematically inside the Unity editor:</p>
                    <ul>
                        <li><strong>Phase 1: Vertical Scan (Y Axis)</strong><br>Scans up and down within <code>autoSearchRadius</code>. Selects points where the vertical offset dominates the horizontal offset:<br><code style="background:transparent; border:none; padding:0; color:var(--docs-accent)">|Offset_Y| &gt; DeadZone  and  |Offset_Y| &gt; |Offset_X|</code></li>
                        <li><strong>Phase 2: Horizontal Scan (X Axis)</strong><br>Scans left and right up to <code>autoSearchRadius * horizontalSearchMultiplier</code>. Selects points where the horizontal offset dominates:<br><code style="background:transparent; border:none; padding:0; color:var(--docs-accent)">|Offset_X| &gt; DeadZone  and  |Offset_X| &gt; |Offset_Y|</code></li>
                        <li><strong>Phase 3: Diagonal Scan</strong><br>Scans diagonal angles using an aspect ratio threshold (<code>diagonalAxisRatio</code>):<br><code style="background:transparent; border:none; padding:0; color:var(--docs-accent)">min(|Offset_X|, |Offset_Y|) / max(|Offset_X|, |Offset_Y|) &ge; diagonalAxisRatio</code></li>
                        <li><strong>Closest-Candidate Priority Logic:</strong> Wipes manual placeholders and enforces a strict <strong>closest-wins</strong> sorting logic. If multiple points fall into the same direction segment, only the closest point is linked and the rest are ignored.</li>
                        <li><strong>Flipped X-Axis Resolution:</strong> Aligns local camera right-hand dot products directly to direction indices, resolving direction flipping issues across wall orientations.</li>
                    </ul>

                    <h3 style="margin-top: 30px;">5. Engineering Evolution & Key Technical Solutions</h3>
                    <p>Throughout the development process, several critical issues were resolved to elevate the game's polish to AAA standards:</p>
                    <ul>
                        <li><strong>Problem 1: Redundant Post-Climb Warp jerks</strong><br><em>Symptom:</em> Pulling up on top of a ledge caused the player to double-jerk/teleport forward by a step immediately after the animation ended.<br><em>Resolution:</em> Identified that the animator already handled root-motion translation onto the platform. Removed a redundant post-warp translation offset (<code>climbOnTopExitOffset</code> Z value set to <code>0</code>), resulting in a perfect transition.</li>
                        <li><strong>Problem 2: Sticky Ledge Float</strong><br><em>Symptom:</em> Leaping off a ledge caused the player to float suspended in mid-air for about 1 second before gravity kicked in.<br><em>Resolution:</em> The physics and character controllers were kept disabled until the transition animation ended. Modified the coroutine to asynchronously re-enable player physics and downward velocities <code>0.15</code> seconds into the leap, causing the player to fall realistically.</li>
                        <li><strong>Problem 3: Duplicate Ledge Directions</strong><br><em>Symptom:</em> The neighbour scanner could register multiple different ledge objects in the exact same direction (e.g. two "Up" links), breaking character navigation.<br><em>Resolution:</em> Refactored the collection engine to index connections by direction vectors. The closest ledge is cached, and any further points attempting to bind to the same direction are automatically skipped.</li>
                    </ul>
                `,
                controls: `

            1: {
                overview: `
                    <p><strong>Online FPS Multiplayer Shooter</strong> is a competitive, high-tick-rate multiplayer arena built on top of the Unity Engine and powered by the <strong>Photon PUN 2</strong> networking framework. The core gameplay loop focuses on high-precision hitscan shooting, lag compensation, client prediction, and server reconciliation to guarantee fair, esports-grade combat.</p>
                    <h3>1. Client-Side Prediction & Locomotion</h3>
                    <p>Standard multiplayer movement feels sluggish due to network round-trip latency. To combat this, the game implements client prediction. Local inputs (WASD, jumps) are applied immediately to the character physics controller, and the local simulation runs ahead of the server. When server updates arrive, the client compares its predicted path against the server authoritative path and reconciles any deviations.</p>
                    <img src="assets/images/diagrams/fps_networking_2d.png" alt="Multiplayer Netcode Timeline Diagram" style="width:100%; max-width:700px; border-radius:8px; border:1px solid var(--docs-border); margin: 15px 0; display:block;">
                `,
                mechanics: `
                    <h3>2. Lag Compensation & Hit Verification</h3>
                    <p>When a player fires, they aim at where they see their opponent. However, due to latency, the target has already moved on the server. The hit verification engine works by buffering the history of all player positions. When a fire packet is received, the server temporarily rewinds all characters back to the exact time the shot was fired by the client, performs the raycast hit test in the rewound state, and applies damage. This prevents the "shot behind cover" anomaly.</p>
                    <h4>Raycasting & Ballistics System</h4>
                    <ul>
                        <li><strong>Dynamic Weapon Recoil:</strong> Uses procedural spring equations to simulate camera shake and recoil recovery based on rapid shot cadences.</li>
                        <li><strong>Hitscan Calculations:</strong> A straight 3D raycast is fired through the weapon muzzle. If it intersects with a player hitbox collider, damage scales based on distance falloff and limb multipliers.</li>
                    </ul>
                `,
                technical: `
                    <h3>3. Network State Serialization & Lag Simulation</h3>
                    <p>This component synchronizes positional data across client screens. Position packets are queued and smoothly interpolated over time to mask network packet jitter.</p>
                    <div class="code-block-header">NetworkSync.cs</div>
                    <pre><code><span class="token-keyword">public class</span> <span class="token-class">NetworkSync</span> : MonoBehaviour, IPunObservable {
    <span class="token-keyword">private</span> Vector3 networkPosition;
    <span class="token-keyword">private</span> Quaternion networkRotation;
    <span class="token-keyword">private float</span> interpolationSpeed = 15f;

    <span class="token-keyword">void</span> <span class="token-function">Update</span>() {
        <span class="token-keyword">if</span> (!photonView.IsMine) {
            <span class="token-comment">// Smoothly interpolate towards the last known server state</span>
            transform.position = Vector3.<span class="token-function">Lerp</span>(transform.position, networkPosition, Time.deltaTime * interpolationSpeed);
            transform.rotation = Quaternion.<span class="token-function">Slerp</span>(transform.rotation, networkRotation, Time.deltaTime * interpolationSpeed);
        }
    }

    <span class="token-keyword">public void</span> <span class="token-function">OnPhotonSerializeView</span>(PhotonStream stream, PhotonMessageInfo info) {
        <span class="token-keyword">if</span> (stream.IsWriting) {
            <span class="token-comment">// Send local state to remote players</span>
            stream.<span class="token-function">SendNext</span>(transform.position);
            stream.<span class="token-function">SendNext</span>(transform.rotation);
        } <span class="token-keyword">else</span> {
            <span class="token-comment">// Receive remote state</span>
            networkPosition = (Vector3)stream.<span class="token-function">ReceiveNext</span>();
            networkRotation = (Quaternion)stream.<span class="token-function">ReceiveNext</span>();
        }
    }
}</code></pre>

                    <p><strong>Thief Long Hand Puzzle</strong> is a highly engaging physics-based puzzle game engineered for mobile touch devices. The core mechanics center around the player stretching and bending an elastic character arm through complex maze structures, avoiding static obstacles, laser tripwires, and patrolling guards to steal a specific prize object.</p>
                    <h3>1. Dynamic Joint Stretching Math</h3>
                    <p>The arm is represented by a procedural chain of physics joints. Input touch positions on the mobile screen project a ray onto the ground plane, producing a stretch direction vector that drives the arm's extension. Limit caps ensure the arm cannot stretch beyond its maximum structural length.</p>
                    <img src="assets/images/diagrams/thief_arm_2d.png" alt="Arm Stretching Physics Joint Diagram" style="width:100%; max-width:700px; border-radius:8px; border:1px solid var(--docs-border); margin: 15px 0; display:block;">
                `,
                mechanics: `
                    <h3>2. Obstacle Collisions & Detection</h3>
                    <p>Each link in the arm chain is equipped with lightweight 2D sphere colliders. The system processes collision triggers at a minimal footprint to guarantee 60 FPS gameplay on low-end mobile devices:</p>
                    <ul>
                        <li><strong>Laser Hazards:</strong> Trigger a line trace hit. If the arm overlaps, it fractures at the point of contact, failing the level.</li>

                `,
                technical: `
                    <h3>3. Procedural Arm Elongation Logic</h3>
                    <p>The stretching physics calculations are processed frame-by-frame, updating joint position vectors and dynamically resizing the segment meshes to match the stretched distance.</p>
                    <div class="code-block-header">ArmController.cs</div>
                    <pre><code><span class="token-keyword">public class</span> <span class="token-class">ArmController</span> : MonoBehaviour {
    <span class="token-keyword">public</span> Transform shoulderPivot;
